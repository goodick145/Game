<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Duc Duy Run</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #101827; color: white;
  font-family: Arial, sans-serif;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#app { position: fixed; inset: 0; overflow: hidden; }

/* Sân khấu cố định 1000x500, được JS co giãn / xoay để luôn nằm ngang */
.stage {
  position: absolute; left: 0; top: 0;
  width: 1000px; height: 500px;
  transform-origin: 0 0;
  background: #b9edff;
  overflow: hidden;
}
canvas { width: 1000px; height: 500px; display: block; touch-action: none; }

.hud {
  position: absolute; left: 12px; top: 10px;
  display: flex; flex-direction: column; gap: 2px;
  padding: 8px 12px; border-radius: 12px;
  background: rgba(8,20,36,0.55);
  font-weight: bold; font-size: 16px; line-height: 1.3;
  text-align: left; pointer-events: none;
}
.ctrl { position: absolute; right: 12px; top: 10px; display: flex; gap: 8px; }
.ctrl button {
  border: none; border-radius: 12px; width: 48px; height: 44px;
  font-size: 22px; font-weight: bold; color: white; background: rgba(71,85,105,0.85);
}
#menuBtn { background: rgba(124,58,237,0.9); }

#menu {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; background: rgba(8,20,36,0.82); padding: 10px;
}
#menu h1 { margin: 0 0 4px; font-size: 40px; }
#menu .mode {
  width: 460px; border: none; border-radius: 14px;
  margin: 0; padding: 14px; font-size: 22px; font-weight: bold; line-height: 1.25;
  background: #38bdf8; color: #082f49;
}
#menu .mode.adv { background: #f9a8d4; color: #500724; }
#menu .mode small { display: block; font-weight: normal; font-size: 14px; opacity: 0.85; margin-top: 3px; }
#menu p { margin: 4px 0 0; color: #cbd5e1; font-size: 14px; text-align: center; }
</style>
</head>

<body>

<div id="app">
  <div class="stage" id="stage">
    <canvas id="game" width="1000" height="500"></canvas>

    <div class="hud">
      <span>Điểm: <span id="score">0</span><span id="goal"></span></span>
      <span>Kỷ lục: <span id="best">0</span></span>
      <span>Tốc độ: <span id="speed">1.0</span>x</span>
    </div>

    <div class="ctrl">
      <button id="restart" title="Chơi lại">↻</button>
      <button id="menuBtn" title="Menu">☰</button>
    </div>

    <div id="menu">
      <h1>⚡ DUC DUY RUN ⚡</h1>
      <button class="mode" id="m-endless">♾ Chế độ vô hạn<small id="bestEndless">Chạy càng xa càng tốt</small></button>
      <button class="mode" id="m-boss" style="background:#fca5a5;color:#450a0a">👹 Đánh boss luôn<small>Bỏ qua phần chạy, đấu Doraemon ngay</small></button>
      <button class="mode adv" id="m-adv">👸 Chế độ phiêu lưu<small id="bestAdv">Đạt 1000 điểm để gặp boss, giải cứu công chúa</small></button>
      <p>Chạm / click màn hình hoặc nhấn SPACE để nhảy • Nhảy kép được • Coi chừng quái bay trên trời!<br><span id="goalText"></span></p>
    </div>
  </div>
</div>

// Âm thanh nhẹ
let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function tone(freq, start, dur, vol, type, freqEnd) {
  try {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + start;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur * 0.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function scareSound() { ensureAudio(); tone(200, 0, 0.45, 0.22, "triangle", 760); }
function chime() { ensureAudio(); [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.12 * i, 0.5, 0.14, "sine")); }

  speed = 6;

  player = {

  running = true;

  document.getElementById("score").textContent = 0;
  document.getElementById("speed").textContent = "1.0";
  if (skipBoss && mode === "adventure") { score = WIN_SCORE; startBoss(); }
}

function jump() {
  if (menuOpen) return;
  if (phase === "scare") return;

  if (gameOver) {
    if (phase === "celebrate" && phaseT < 1200) return;
    reset();
    return;
  }

  if (!running) running = true;

  if (player.jumps < 2) {
    player.vy = player.jumps === 0 ? -16 : -14;
    player.jumps++;

    for (let i = 0; i < 6; i++) {
      particles.push({
        x: player.x + 20,
        y: ground,
        vx: -Math.random() * 3,
        vy: -Math.random() * 3,
        life: 20
      });
    }
  }
}

function roundRect(x, y, w, h, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();
}

// Vẽ nhân vật lớn
function drawPlayer() {
  let p = player;

  // Bóng dưới chân
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.beginPath();
  ctx.ellipse(p.x + 27, ground + 3, 34, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Chân chạy
  let swing = running && p.y >= ground - p.h - 1
    ? Math.sin(performance.now() * 0.018) * 7 : 0;

  roundRect(p.x + 9, p.y + 55, 14, 23 + swing, 5, "#155e75");
  roundRect(p.x + 32, p.y + 55, 14, 23 - swing, 5, "#155e75");

  // Thân
  roundRect(p.x + 5, p.y + 19, 45, 46, 12, "#0891b2");

  // Đầu (ảnh đã tách nền) + chong chóng
  let hh = 58;
  let hw = hh * playerHead.naturalWidth / playerHead.naturalHeight || 41;
  let hx = p.x + 27 - hw / 2 + 3;
  let hy = p.y + 40 - hh;
  if (playerHead.complete && playerHead.naturalWidth) {
    ctx.drawImage(playerHead, hx, hy, hw, hh);
  } else {
    roundRect(p.x + 10, p.y, 38, 34, 12, "#06b6d4");
  }

  // Chong chóng trên đầu
  let px = hx + hw * 0.55, py = hy + 3;
  ctx.strokeStyle = "#fbbf24";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px, py - 11);
  ctx.stroke();
  let spin = Math.sin(performance.now() * 0.03);
  ctx.fillStyle = "#fbbf24";
  ctx.beginPath();
  ctx.ellipse(px, py - 12, 15 * Math.abs(spin) + 2, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Khăn choàng
  ctx.fillStyle = "#f97316";
  ctx.beginPath();
  ctx.moveTo(p.x + 7, p.y + 27);
  ctx.lineTo(p.x - 12, p.y + 36);
  ctx.lineTo(p.x + 7, p.y + 39);
  ctx.fill();
}

// Vẽ quái vật và đá
function drawFlyer(o) {
  const cx = o.x + o.w / 2;
  const flap = Math.sin(o.t * 3.2);

  // Bóng mờ dưới đất
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath();
  ctx.ellipse(cx, ground + 3, 20, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Cánh vỗ
  ctx.fillStyle = "rgba(255,255,255,0.95)";
  ctx.strokeStyle = "#94a3b8";
  ctx.lineWidth = 2;
  [-1, 1].forEach(side => {
    ctx.save();
    ctx.translate(cx + side * (o.w * 0.5 - 2), o.y + o.h * 0.5);
    ctx.rotate(side * (0.5 + flap * 0.55));
    ctx.beginPath();
    ctx.ellipse(side * 22, 0, 26, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  });

  // Mặt
  if (flyFace.complete && flyFace.naturalWidth) {
    ctx.drawImage(flyFace, o.x, o.y, o.w, o.h);
  } else {
    roundRect(o.x, o.y, o.w, o.h, 16, "#f59e0b");
  }
}

function hadoRect(o) {
  return { x: o.x + o.w - 2, y: ground - 100, w: 150 * Math.min(1, o.blast), h: 100 };
}

// Hado #99 – Kurohitsugi (phong cách tự vẽ): lửa tím trắng + mảnh đen
function drawHado(x0, g, now) {
  const len = 150 * g;

  let gl = ctx.createRadialGradient(x0 + len / 2, ground - 40, 5, x0 + len / 2, ground - 40, 110);
  gl.addColorStop(0, "rgba(255,255,255,0.85)");
  gl.addColorStop(0.35, "rgba(192,132,252,0.55)");
  gl.addColorStop(1, "rgba(126,34,206,0)");
  ctx.fillStyle = gl;
  ctx.beginPath();
  ctx.ellipse(x0 + len / 2, ground - 40, len / 2 + 30, 80, 0, 0, Math.PI * 2);
  ctx.fill();

  for (let i = 0; i < 6; i++) {
    const bx = x0 + 10 + i * (len - 20) / 5;
    const hh = (52 + (i % 3) * 20 + Math.sin(now * 6 + i * 1.7) * 10) * g;
    const sway = 14 + Math.sin(now * 5 + i) * 9;     // ngả về phía sau
    let lg = ctx.createLinearGradient(0, ground, 0, ground - hh);
    lg.addColorStop(0, "rgba(255,255,255,0.95)");
    lg.addColorStop(0.45, "rgba(216,180,254,0.9)");
    lg.addColorStop(1, "rgba(147,51,234,0)");
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(bx - 13, ground);
    ctx.quadraticCurveTo(bx - 8, ground - hh * 0.6, bx + sway, ground - hh);
    ctx.quadraticCurveTo(bx + 10, ground - hh * 0.45, bx + 15, ground);
    ctx.closePath();
    ctx.fill();
  }

  // Mảnh đen bay lơ lửng
  for (let k = 0; k < 8; k++) {
    const px = x0 + ((k * 41 + 12) % Math.max(20, len));
    const py = ground - ((now * 55 + k * 29) % 105);
    const sz = (4 + (k % 3) * 2) * g;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(now * 2 + k);
    ctx.fillStyle = k % 3 === 0 ? "#2e1065" : "#0b0617";
    ctx.fillRect(-sz, -sz, sz * 2, sz * 2);
    ctx.restore();
  }
}

function drawObstacle(o) {
  if (o.type === 3) {
    drawFlyer(o);
  } else if (o.type === 2) {
    drawShooter(o);
  } else if (o.type === 0) {
    // Đá gai
    ctx.fillStyle = "#e05d44";
    ctx.beginPath();
    ctx.moveTo(o.x, o.y + o.h);
    ctx.lineTo(o.x + 5, o.y + 18);
    ctx.lineTo(o.x + 18, o.y + 27);
    ctx.lineTo(o.x + o.w * 0.48, o.y);
    ctx.lineTo(o.x + o.w * 0.68, o.y + 22);
    ctx.lineTo(o.x + o.w, o.y + 10);
    ctx.lineTo(o.x + o.w - 3, o.y + o.h);
    ctx.closePath();
    ctx.fill();

  } else {
    drawGroundFace(o);
  }
}

// Quái dưới đất: mặt người đã tách nền, chạy trên đôi chân nhỏ
function drawGroundFace(o) {
  const cx = o.x + o.w / 2;
  const now = performance.now() * 0.001;
  const run = Math.sin(performance.now() * 0.02 + o.x * 0.05);
  const legH = 12;

  // Tích lực khi tiến lại gần, rồi phóng Hado 99 ra sau lưng
  const trig = player.x + 480, start = W - 60;
  const ch = Math.max(0, Math.min(1, (start - o.x) / (start - trig)));
  if (ch > 0 && o.blast < 1) {
    const rad = 22 + ch * 32;
    let ag = ctx.createRadialGradient(cx, o.y + o.h * 0.5, 4, cx, o.y + o.h * 0.5, rad);
    ag.addColorStop(0, "rgba(233,213,255," + (0.35 + ch * 0.5) + ")");
    ag.addColorStop(1, "rgba(147,51,234,0)");
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.arc(cx, o.y + o.h * 0.5, rad, 0, Math.PI * 2);
    ctx.fill();
  }
  if (o.blast > 0) drawHado(o.x + o.w - 2, Math.min(1, o.blast), now);

  // Bóng
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.beginPath();
  ctx.ellipse(cx, ground + 3, o.w * 0.55, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Chân
  roundRect(cx - 14, o.y + o.h - legH, 10, legH + run * 2, 4, "#334155");
  roundRect(cx + 4, o.y + o.h - legH, 10, legH - run * 2, 4, "#334155");

  // Mặt
  const hh = o.h - legH + 4;
  const hw = hh * (groundFace.naturalWidth || 120) / (groundFace.naturalHeight || 200);
  if (groundFace.complete && groundFace.naturalWidth) {
    ctx.drawImage(groundFace, cx - hw / 2, o.y, hw, hh);
  } else {
    roundRect(cx - 24, o.y, 48, hh, 16, "#fcd9b6");
  }
}

// Vẽ quái bắn đậu (đầu người đã tách nền gắn lên thân cây)
const HEAD_H = 84;
function drawShooter(o) {
  let cx = o.x + o.w / 2;
  let t = o.shootAnim > 0 ? o.shootAnim / 12 : 0;   // giật khi bắn

  // Bóng
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.beginPath();
  ctx.ellipse(cx, ground + 3, 32, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Thân cây
  let stemTop = o.y + HEAD_H - 10;
  ctx.fillStyle = "#2f9e44";
  ctx.beginPath();
  ctx.roundRect(cx - 7, stemTop, 14, ground - stemTop, 4);
  ctx.fill();

  // Lá
  ctx.fillStyle = "#37b24d";
  ctx.beginPath();
  ctx.ellipse(cx - 20, ground - 14, 22, 9, -0.5, 0, Math.PI * 2);
  ctx.ellipse(cx + 20, ground - 22, 22, 9, 0.5, 0, Math.PI * 2);
  ctx.fill();

  // Đầu (ảnh đã tách nền), phồng lên khi bắn
  if (monsterHead.complete && monsterHead.naturalWidth) {
    let scale = 1 + t * 0.08;
    let h = HEAD_H * scale;
    let w = h * monsterHead.naturalWidth / monsterHead.naturalHeight;
    ctx.drawImage(monsterHead, cx - w / 2 - t * 4, o.y + HEAD_H - h, w, h);
  }
}

// Vẽ cảnh nền
function drawBackground() {
  let gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, "#b9edff");
  gradient.addColorStop(1, "#f2fcff");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // Mặt trời
  ctx.fillStyle = "#fff3ad";
  ctx.beginPath();
  ctx.arc(820, 75, 35, 0, Math.PI * 2);
  ctx.fill();

  // Mây
  clouds.forEach(c => {
    if (running) c.x -= scroll * 0.12;

    if (c.x < -100) c.x = W + 50;

    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 18, 0, Math.PI * 2);
    ctx.arc(c.x + 22, c.y - 10, 23, 0, Math.PI * 2);
    ctx.arc(c.x + 45, c.y, 17, 0, Math.PI * 2);
    ctx.fill();
  });

  // Đồi
  ctx.fillStyle = "#9bdab9";
  ctx.beginPath();
  ctx.moveTo(0, ground);

  for (let x = 0; x <= W; x += 100) {
    ctx.quadraticCurveTo(x + 50, ground - 70, x + 100, ground);
  }

  ctx.closePath();
  ctx.fill();

  // Mặt đất
  ctx.fillStyle = "#236b59";
  ctx.fillRect(0, ground, W, H - ground);

  ctx.fillStyle = "#65b86e";
  ctx.fillRect(0, ground, W, 9);

  groundOffset = (groundOffset + (running ? scroll : 0)) % 45;

  ctx.strokeStyle = "#a4e5ad";
  ctx.lineWidth = 3;

  for (let x = -45 - groundOffset; x < W; x += 45) {
    ctx.beginPath();
    ctx.moveTo(x, ground + 30);
    ctx.lineTo(x + 20, ground + 30);
    ctx.stroke();
  }
}

// Kiểm tra va chạm
function hit(a, b) {
  let padding = 7;

  return (
    a.x + padding < b.x + b.w - 5 &&
    a.x + a.w - padding > b.x + 5 &&
    a.y + padding < b.y + b.h &&
    a.y + a.h - padding > b.y + 5
  );
}

function saveBest() {
  let finalScore = Math.floor(score);
  if (finalScore > best) {
    best = finalScore;
    localStorage.setItem(bestKey(), best);
  }
  document.getElementById("best").textContent = best;
}

function endGame() {
  running = false;
  gameOver = true;
  saveBest();
}

function addHeart(burst) {
  if (!princess) return;
  hearts.push({
    x: princess.x + 30 + (Math.random() - 0.5) * (burst ? 90 : 40),
    y: ground - 100 - (burst ? Math.random() * 40 : 0),
    vx: (Math.random() - 0.5) * (burst ? 3 : 1.2),
    vy: -1.2 - Math.random() * (burst ? 2.2 : 1),
    life: 60 + Math.random() * 30,
    s: 18 + Math.random() * 16
  });
}

// Cập nhật game
function update(dt) {
  if (!running) return;

  let step = dt / 16.67;
  phaseT += dt;

  if (phase === "play") {
    score += step * speed * 0.12;
    speed = Math.min(22, 6 + score / 200);   // tăng tốc từ từ

    // Chế độ phiêu lưu: đủ điểm thì dừng sinh quái, chờ công chúa xuất hiện
    if (mode === "adventure" && score >= WIN_SCORE) {
      score = WIN_SCORE;
      phase = "clear";
      phaseT = 0;
    }
  }

  document.getElementById("score").textContent = Math.floor(score);
  document.getElementById("speed").textContent = (speed / 6).toFixed(1);

  // Tốc độ cuộn nền
  if (phase === "play" || phase === "clear" ||
      (phase === "approach" && princess && !princess.stopped)) {
    scroll = speed;
  } else if (phase === "boss") {
    scroll = 3;
  } else if (phase === "celebrate") {
    scroll = 4;
  } else {
    scroll = 0;
  }

  // Trọng lực
  player.vy += 0.78 * step;
  player.y += player.vy * step;

  if (player.y >= ground - player.h) {
    player.y = ground - player.h;
    player.vy = 0;
    player.jumps = 0;
  }

  // Sinh chướng ngại vật
  if (phase === "play") {
    spawnTimer -= step;

    if (spawnTimer <= 0) {
      let r = Math.random();
      let type = r < 0.27 ? 0 : (r < 0.62 ? 1 : (r < 0.82 ? 2 : 3));
      if (type === 3 && score <= 60) type = 1;   // quái bay xuất hiện sau 60 điểm

      let h = type === 0
        ? 48 + Math.random() * 30
        : type === 1 ? 65 + Math.random() * 15
        : type === 2 ? 110 : 92;

      let w = type === 0
        ? 42 + Math.random() * 18
        : type === 1 ? 44 + Math.random() * 6
        : type === 2 ? 64 : 54;

      let oy = ground - h;
      if (type === 3) oy = ground - h - (100 + Math.random() * 55);

      obstacles.push({
        x: W + 20,
        y: oy,
        baseY: oy,
        t: Math.random() * 6,
        w: w,
        h: h,
        type: type,
        shootTimer: 4 + Math.random() * 8,
        fired: false,
        blast: 0,
        shootAnim: 0
      });

      spawnTimer = Math.max(42, 95 - score / 12) + Math.random() * 35;
    }
  }

  obstacles.forEach(o => {
    o.x -= speed * step;
    if (o.type === 3) {
      o.x -= 1.6 * step;                 // bay nhanh hơn một chút
      o.t += 0.09 * step;
      o.y = o.baseY + Math.sin(o.t) * 12; // lượn lên xuống
    }
  });

  obstacles = obstacles.filter(o => o.x + o.w > -20);

  // Quái bắn đậu
  obstacles.forEach(o => {
    if (o.type !== 2) return;
    if (o.shootAnim > 0) o.shootAnim -= step;
    if (o.x < W - 60 && o.x > player.x + 120) {
      o.shootTimer -= step;
      if (o.shootTimer <= 0) {
        peas.push({ x: o.x + 12, y: o.y + HEAD_H * 0.8, r: 9 });
        o.shootAnim = 12;
        o.shootTimer = Math.max(48, 100 - score / 25);   // bắn dày hơn theo điểm
      }
    }
  });

  // Quái Hado 99: tích lực rồi phóng kỹ năng ra sau lưng
  obstacles.forEach(o => {
    if (o.type !== 1) return;
    if (!o.fired && o.x < player.x + 480) o.fired = true;
    if (o.fired && o.blast < 1) o.blast = Math.min(1, o.blast + 0.09 * step);
  });

  peas.forEach(p => { p.x -= (speed + 1.8 + score / 600) * step; });
  peas = peas.filter(p => p.x > -20);

  if (phase === "play" || phase === "clear" || phase === "approach") {
    for (let p of peas) {
      let nx = Math.max(player.x + 8, Math.min(p.x, player.x + player.w - 8));
      let ny = Math.max(player.y + 6, Math.min(p.y, player.y + player.h));
      let dx = p.x - nx, dy = p.y - ny;
      if (dx * dx + dy * dy < (p.r - 2) * (p.r - 2)) {
        endGame();
        break;
      }
    }

    for (let o of obstacles) {
      if (hit(player, o) || (o.type === 1 && o.blast > 0.2 && hit(player, hadoRect(o)))) {
        endGame();
        break;
      }
    }
  }

  if (!running) return;

  // ===== Công chúa =====
  if (phase === "clear" && obstacles.length === 0 && peas.length === 0) {
    startBoss();   // trận boss Doraemon trước khi gặp công chúa
  }

  if (phase === "boss" && boss) updateBoss(step);

  if (princess) princess.t += step;

  if (phase === "approach" && princess) {
    if (!princess.stopped) {
      princess.x -= speed * step;
      if (princess.x <= 610) {
        princess.x = 610;
        princess.stopped = true;
      }
    } else {
      // Nhân vật tự chạy tới chỗ công chúa
      player.x += 6 * step;
      if (player.x + player.w - 12 > princess.x + 8) {
        phase = "scare";
        phaseT = 0;
        scareSound();
      }
    }
  }

  if (phase === "scare" && phaseT > 1400) {
    phase = "celebrate";
    phaseT = 0;
    princess.freed = true;
    won = true;
    gameOver = true;
    saveBest();
    chime();
    for (let i = 0; i < 16; i++) addHeart(true);
  }

  if (phase === "celebrate" && Math.random() < 0.25 * step) addHeart(false);

  hearts.forEach(h => {
    h.x += h.vx * step;
    h.y += h.vy * step;
    h.life -= step;
  });
  hearts = hearts.filter(h => h.life > 0);

  particles.forEach(p => {
    p.x += p.vx * step;
    p.y += p.vy * step;
    p.vy += 0.15 * step;
    p.life -= step;
  });

  particles = particles.filter(p => p.life > 0);
}

// Vẽ lồng
function drawCage(cx) {
  const x0 = cx - 44, x1 = cx + 44, top = ground - 170;
  ctx.strokeStyle = "#64748b";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x0, ground);
  ctx.lineTo(x0, top + 22);
  ctx.quadraticCurveTo(cx, top - 14, x1, top + 22);
  ctx.lineTo(x1, ground);
  ctx.stroke();

  ctx.lineWidth = 3;
  for (let i = 1; i < 6; i++) {
    const x = x0 + (x1 - x0) * i / 6;
    ctx.beginPath();
    ctx.moveTo(x, ground);
    ctx.lineTo(x, top + 20 - 18 * Math.sin(Math.PI * i / 6));
    ctx.stroke();
  }

  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x0, ground - 60);
  ctx.lineTo(x1, ground - 60);
  ctx.stroke();

  // Ổ khóa
  ctx.strokeStyle = "#d4a017";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, ground - 68, 6, Math.PI, 0);
  ctx.stroke();
  roundRect(cx - 9, ground - 68, 18, 14, 3, "#fbbf24");
}

// Vẽ công chúa (mặt thật đã tách nền gắn lên thân váy)
function drawPrincess(p) {
  const cx = p.x + 30;
  const bob = p.freed ? Math.abs(Math.sin(p.t * 0.18)) * 6 : 0;
  const gy = ground - bob;

  // Bóng
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.beginPath();
  ctx.ellipse(cx, ground + 3, 32, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Chân
  roundRect(cx - 12, gy - 14, 8, 14, 3, "#fcd9b6");
  roundRect(cx + 4, gy - 14, 8, 14, 3, "#fcd9b6");

  // Váy
  ctx.fillStyle = "#f472b6";
  ctx.beginPath();
  ctx.moveTo(cx - 12, gy - 66);
  ctx.lineTo(cx + 12, gy - 66);
  ctx.quadraticCurveTo(cx + 22, gy - 30, cx + 34, gy - 10);
  for (let i = 0; i < 4; i++) {
    ctx.quadraticCurveTo(cx + 34 - i * 17 - 8.5, gy + 3, cx + 34 - (i + 1) * 17, gy - 10);
  }
  ctx.quadraticCurveTo(cx - 22, gy - 30, cx - 12, gy - 66);
  ctx.fill();

  ctx.strokeStyle = "#fbcfe8";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx - 30, gy - 14);
  for (let i = 0; i < 4; i++) {
    ctx.quadraticCurveTo(cx - 30 + i * 15 + 7.5, gy - 4, cx - 30 + (i + 1) * 15, gy - 14);
  }
  ctx.stroke();

  // Thân trên + thắt lưng
  roundRect(cx - 13, gy - 88, 26, 26, 8, "#ec4899");
  roundRect(cx - 14, gy - 70, 28, 8, 3, "#fbbf24");

  // Tay (vẫy)
  ctx.strokeStyle = "#fcd9b6";
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(cx - 12, gy - 80);
  ctx.lineTo(cx - 25, gy - 58);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + 12, gy - 80);
  ctx.lineTo(cx + 27 + Math.sin(p.t * 0.25) * 6, gy - 106);
  ctx.stroke();
  ctx.lineCap = "butt";

  // Mặt
  const hh = 66;
  const hw = hh * (princessHead.naturalWidth || 149) / (princessHead.naturalHeight || 170);
  const hy = gy - 80 - hh;
  if (princessHead.complete && princessHead.naturalWidth) {
    ctx.drawImage(princessHead, cx - hw / 2, hy, hw, hh);
  } else {
    roundRect(cx - 18, hy, 36, hh * 0.8, 14, "#fcd9b6");
  }

  // Vương miện
  const cy = hy + 6;
  ctx.fillStyle = "#fbbf24";
  ctx.beginPath();
  ctx.moveTo(cx - 17, cy);
  ctx.lineTo(cx - 19, cy - 16);
  ctx.lineTo(cx - 9, cy - 8);
  ctx.lineTo(cx, cy - 20);
  ctx.lineTo(cx + 9, cy - 8);
  ctx.lineTo(cx + 19, cy - 16);
  ctx.lineTo(cx + 17, cy);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#ef4444";
  ctx.beginPath();
  ctx.arc(cx, cy - 6, 3, 0, Math.PI * 2);
  ctx.fill();

  if (!p.freed) {
    drawCage(cx);

    // Bong bóng lời thoại
    if (phase === "approach" && p.x < W - 90) {
      const bx = cx - 68, by = ground - 170 - 44;
      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.roundRect(bx, by, 136, 30, 12);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - 8, by + 30);
      ctx.lineTo(cx + 2, by + 40);
      ctx.lineTo(cx + 8, by + 30);
      ctx.fill();
      ctx.fillStyle = "#831843";
      ctx.font = "bold 15px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Cứu em với! 🥺", cx, by + 20);
      ctx.textAlign = "left";
    }
  }
}

// Jumpscare nhẹ: mặt công chúa phóng to rồi mờ dần
function drawScare() {
  const t = Math.min(1, phaseT / 1400);
  const grow = Math.min(1, t / 0.18);
  const ease = 1 - Math.pow(1 - grow, 3);
  const scale = 0.35 + 0.65 * ease;
  const fade = t < 0.65 ? 1 : Math.max(0, (1 - t) / 0.35);

  ctx.fillStyle = "rgba(10,5,20," + (0.5 * fade) + ")";
  ctx.fillRect(0, 0, W, H);

  if (phaseT < 110) {
    ctx.fillStyle = "rgba(255,255,255," + (0.7 * (1 - phaseT / 110)) + ")";
    ctx.fillRect(0, 0, W, H);
  }

  const shake = (1 - t) * 6;
  const size = 400 * scale;
  const cxs = W / 2 + (Math.random() - 0.5) * shake * 2;
  const cys = H / 2 + 6 + (Math.random() - 0.5) * shake * 2;

  ctx.save();
  ctx.globalAlpha = fade;
  ctx.translate(cxs, cys);

  const g = ctx.createRadialGradient(0, 0, size * 0.25, 0, 0, size * 0.78);
  g.addColorStop(0, "rgba(255,225,240,0.9)");
  g.addColorStop(1, "rgba(255,225,240,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, size * 0.78, 0, Math.PI * 2);
  ctx.fill();

  if (scareFace.complete && scareFace.naturalWidth) {
    const fh = size * scareFace.naturalHeight / scareFace.naturalWidth;
    ctx.drawImage(scareFace, -size / 2, -fh / 2, size, fh);
  }
  ctx.restore();

  if (ease > 0.8) {
    ctx.globalAlpha = fade;
    ctx.textAlign = "center";
    ctx.font = "bold 34px Arial";
    ctx.lineWidth = 6;
    ctx.strokeStyle = "rgba(131,24,67,0.9)";
    ctx.fillStyle = "white";
    ctx.strokeText("Công chúa đây rồi! 💖", W / 2, H - 28);
    ctx.fillText("Công chúa đây rồi! 💖", W / 2, H - 28);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }
}

function drawCelebrate() {
  ctx.fillStyle = "rgba(255,200,230,0.18)";

  ctx.textAlign = "center";

// Hiển thị
// ===================== BOSS DORAEMON =====================
function hurt(n) {
  if (inv > 0 || shield > 0) return;
  pHP -= n; inv = 1000; shake = 12;
  if (pHP <= 0) { pHP = 0; endGame(); }
}
function pHit(cx, cy, r) {
  const nx = Math.max(player.x + 8, Math.min(cx, player.x + player.w - 8));
  const ny = Math.max(player.y + 6, Math.min(cy, player.y + player.h));
  return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < r * r;
}
function startBoss() {
  boss = { st: "warn", t: 0, hp: 700, max: 700, ph: 1, x: 800, y: ground, sc: 0.01, cd: 0, rest: 0,
           shots: 0, n: 0, sub: 0, tt: 0, lock: 800, wq: 0, wt: 0, dropT: 9000, flash: 0,
           mon: [groundFace, flyFace, monsterHead].map((im, i) => ({ im, a: i * 2.1, r: 330 - i * 30 })) };
  phase = "boss"; phaseT = 0; pHP = 100; inv = 0; dbl = 0; shield = 0; fireT = 0;
  pb = []; bd = []; drops = []; waves = [];
  scareSound();
}
function endBoss() {
  for (let i = 0; i < 40; i++) particles.push({ x: boss.x + (Math.random() - 0.5) * 140, y: ground - Math.random() * 220,
    vx: (Math.random() - 0.5) * 8, vy: -Math.random() * 6, life: 30 });
  boss = null; pb = []; bd = []; drops = []; waves = [];
  chime();
  princess = { x: W + 80, w: 60, stopped: false, freed: false, t: 0 };
  phase = "approach"; phaseT = 0;
}
function donut(x, y, v, vy) { bd.push({ x, y, v, a: 0, vy: vy || 0 }); }

function updateBoss(step) {
  const b = boss, ms = step * 16.67;
  b.t += ms;
  if (inv > 0) inv -= ms;
  if (dbl > 0) dbl -= ms;
  if (shield > 0) shield -= ms;
  if (shake > 0) shake -= step;
  if (b.flash > 0) b.flash -= step;
  if (b.doorFlash > 0) b.doorFlash -= step;

  if (b.st === "warn") { if (b.t > 2400) { b.st = "absorb"; b.t = 0; } return; }
  if (b.st === "absorb") {          // hút 3 con quái vào người
    b.mon.forEach(m => { m.a += 0.08 * step; m.r = Math.max(0, m.r - 2.4 * step); });
    const left = b.mon.filter(m => m.r > 8).length;
    b.sc = 0.4 + 0.2 * (3 - left);
    if (left === 0) { b.sc = 1; b.st = "roar"; b.t = 0; shake = 30; scareSound(); }
    return;
  }
  if (b.st === "roar") { if (b.t > 1000) { b.st = "fight"; b.t = 0; b.rest = 800; } return; }

  // --- người chơi tự bắn ---
  fireT -= ms;
  if (fireT <= 0) { fireT = 300; pb.push({ x: player.x + player.w, y: player.y + 32 }); }
  pb.forEach(p => { p.x += 12 * step; });
  pb = pb.filter(p => {
    if (b.st === "fight" && b.sub === 5 && b.doorOpen && p.x > b.x - 140) {   // cửa hấp thụ đạn
      b.stored = Math.min(6, (b.stored || 0) + 1); b.doorFlash = 8; return false;
    }
    if (b.st === "fight" && p.x > b.x - 70 * b.sc && p.x < b.x + 70 && p.y > b.y - 234 && p.y < b.y) {
      if (!b.eating) { b.hp -= dbl > 0 ? 10 : 5; b.flash = 5; }
      return false;
    }
    return p.x < W + 20;
  });
  if (b.st === "fight" && b.hp <= 0) {
    if (b.ph < 3) {
      b.ph++; b.hp = b.max = (b.ph === 2 ? 500 : 400); b.st = "morph"; b.t = 0; b.sub = 0; b.cd = 1500; b.n = 0; b.eatIdx = 0; b.eating = false;
      bd = []; waves = []; shake = 25; scareSound();
    } else { endBoss(); return; }
  }
  if (b.st === "morph") { b.x += (800 - b.x) * 0.1 * step; b.y += (ground - b.y) * 0.1 * step;
    if (b.t > 1500) { b.st = "fight"; b.t = 0; } }

  // --- vật phẩm rơi ---
  b.dropT -= ms;
  if (b.dropT <= 0 && b.st === "fight") {
    drops.push({ x: W + 20, y0: ground - 120 - Math.random() * 50, t: 0, type: Math.floor(Math.random() * 3) });
    b.dropT = 16000;
  }
  drops.forEach(d => { d.x -= 4.2 * step; d.t += 0.08 * step; d.y = d.y0 + Math.sin(d.t) * 70; });
  drops = drops.filter(d => {
    if (pHit(d.x, d.y, 14)) {
      if (d.type === 0) pHP = Math.min(100, pHP + 30);
      else if (d.type === 1) dbl = 8000;
      else shield = 5000;
      chime(); return false;
    }
    return d.x > -30;
  });

  // --- đạn / sóng của boss ---
  bd.forEach(d => { d.x -= d.v * step; d.y += d.vy * step; d.a += 0.15 * step; });
  bd = bd.filter(d => { if (pHit(d.x, d.y, d.r || 14)) { hurt(20); return false; } return d.x > -30 && d.x < W + 40 && d.y < ground + 30; });
  waves.forEach(w => { w.x -= w.v * step; });
  waves = waves.filter(w => { if (pHit(w.x, ground - 17, 14) || (player.y + player.h > ground - 30 &&
    Math.abs(player.x + 27 - w.x) < 22)) { hurt(20); } return w.x > -30; });

  if (b.st !== "fight") return;
  const f = b.hp / b.max;
  const sp = n => n + (b.ph === 3 && b.hp <= b.max * 0.25 ? 1.5 : 0);

  // Giai đoạn 3: ăn 3 bánh rán (+20 HP mỗi cái), bất tử khi ăn, ăn 3 lần ở 60% / 35% / 15% máu
  if (b.ph === 3 && (b.eating || (b.eatIdx < 3 && b.sub === 0 && b.hp <= b.max * [0.6, 0.35, 0.15][b.eatIdx]))) {
    if (!b.eating) { b.eating = true; b.eatN = 3; b.eatT = 0; }
    b.eatT += ms;
    if (b.eatT > 800) { b.eatT = 0; b.hp = Math.min(b.max, b.hp + 20); b.eatN--;
      if (b.eatN <= 0) { b.eating = false; b.eatIdx++; b.cd = 800; } }
    return;
  }

  if (b.ph === 1) {
    if (b.rest > 0) { b.rest -= ms; return; }
    b.cd -= ms;
    if (b.cd <= 0) {
      const v = 6.5 + 3.5 * (1 - f), g = Math.round(v * 44), r = Math.random(), x = b.x - 90;
      if (r < 0.2) { donut(x, ground - 24, v); donut(x + 110, ground - 24, v); }
      else if (r < 0.35) donut(x, ground - 115, v);
      else if (r < 0.7) { for (let i = 0; i < 4; i++) donut(x + i * g, i % 2 ? ground - 115 : ground - 24, v); }
      else { for (let i = 0; i < 6; i++) { donut(x + i * g, i % 2 ? ground - 115 : ground - 24, v); if (i === 2 || i === 4) donut(x + i * g + 100, ground - 24, v); } }
      b.cd = 520 + 400 * f;
      if (++b.shots % 6 === 0) b.rest = 1000;
    }
    return;
  }

  // Giai đoạn 2-3
  if (b.sub === 0) {
    b.x += (800 - b.x) * 0.06 * step;
    b.cd -= ms;
    if (b.cd <= 0) {
      const k = b.n++ % (b.ph === 3 ? 6 : 4);
      const v = sp((b.ph === 3 ? 8.5 : 7) + 2.5 * (1 - f)), g = Math.round(v * 44), x = b.x - 90;
      if (k === 0) { b.kind = "dive"; b.sub = 1; b.tt = 0; b.lock = player.x; }
      else if (k === 1) { b.kind = "stomp"; b.sub = 1; b.tt = 0; b.lock = 800; }
      else if (k === 2) { for (let i = 0; i < (b.ph === 3 ? 6 : 5); i++) donut(x + i * g, i % 2 ? ground - 115 : ground - 24, v); b.cd = b.ph === 3 ? 1400 : 1700; }
      else if (k === 5 || (b.ph === 2 && k === 3)) {          // ĐẠI BÁC KHÔNG KHÍ
        const hi = ground - 112, lo = ground - 24;
        const seq = (b.ph === 3 ? [hi, lo, lo, hi, lo, hi] : [hi, lo, hi, lo]).sort(() => Math.random() - 0.5);
        b.sub = 6; b.tt = 0; b.cn = { seq, si: 0, stage: "aim", t: 900, left: 0, e: 0, v: b.ph === 3 ? 10.5 : 8.5 };
      }
      else if (k === 3) { for (let i = 0; i < 3; i++) { donut(x + i * g * 2, ground - 24, v); donut(x + g + i * g * 2, ground - 200, v * 0.95, 1.9); } b.cd = 1800; }
      else { b.sub = 5; b.tt = 0; b.stored = 0; b.warned = false; b.doorOpen = true; }
    }
  } else {
    b.tt += ms;
    if (b.sub === 5) {            // cánh cửa thần kỳ
      b.x += (800 - b.x) * 0.1 * step;
      if (b.tt >= 2200 && !b.warned) {
        b.warned = true; b.doorOpen = false;
        const n = Math.max(4, Math.min(5, b.stored));
        b.hs = []; for (let i = 0; i < n; i++) b.hs.push(Math.random() < 0.5 ? ground - 30 : ground - 112);
        b.fi = 0; b.ft = 1100;
      }
      if (b.warned && b.tt >= 3000) {
        b.ft -= ms;
        if (b.ft <= 0 && b.fi < b.hs.length) { bd.push({ x: 50, y: b.hs[b.fi], v: -8, a: 0, vy: 0, r: 13, back: true }); b.fi++; b.ft = 1000; }
        if (b.fi >= b.hs.length && b.ft < 300) { b.sub = 0; b.warned = false; b.cd = 700 + 600 * f; }
      }
    } else if (b.sub === 6) {            // đại bác: dải đạn liên tục
      b.x += (800 - b.x) * 0.1 * step;
      const c = b.cn;
      if (c.stage === "aim") {
        c.t -= ms;
        if (c.t <= 0) { c.stage = "fire"; c.left = c.seq[c.si] < ground - 60 ? 12 : 9; c.e = 0; }
      } else {
        c.e -= step;
        if (c.e <= 0 && c.left > 0) {
          bd.push({ x: b.x - 170, y: c.seq[c.si], v: c.v, a: 0, vy: 0, r: 12, air: true });
          c.left--; c.e = 3.2;
        }
        if (c.left <= 0) {
          c.si++;
          if (c.si >= c.seq.length) { b.sub = 0; b.cd = (b.ph === 3 ? 600 : 900) + 500 * f; }
          else { c.stage = "aim"; c.t = b.ph === 3 ? 560 : 700; }
        }
      }
    } else if (b.sub === 1) {            // bay lên
      b.y -= (b.ph === 3 ? 22 : 14) * step; b.x += (b.lock - b.x) * 0.08 * step;
      if (b.y < -30) { b.y = -30; b.sub = 2; b.tt = 0; }
    } else if (b.sub === 2) {     // cảnh báo
      if (b.kind === "dive") b.lock = player.x;
      b.x += (b.lock - b.x) * 0.2 * step;
      if (b.tt > (b.ph === 3 ? 650 : f < 0.35 ? 800 : 1100)) { b.sub = 3; b.x = b.lock; }
    } else if (b.sub === 3) {     // lao xuống
      b.y += (b.ph === 3 ? 62 : 38) * step;
      if (b.y >= ground) {
        b.y = ground; b.sub = 4; b.tt = 0; shake = 22;
        b.wq = b.kind === "stomp" ? (b.ph === 3 ? 6 : f > 0.6 ? 3 : f > 0.3 ? 4 : 5) : 0; b.wt = 0;
      }
    } else if (b.sub === 4) {     // dậm tại chỗ: nhiều sóng liên tiếp
      b.wt -= ms;
      if (b.wq > 0 && b.wt <= 0) { waves.push({ x: b.x - 70, v: b.ph === 3 ? 11 : 8.5, h: 42 + Math.random() * 14 }); b.wq--; b.wt = b.ph === 3 ? 360 : 470; }
      b.x += (800 - b.x) * (b.kind === "dive" ? 0.12 : 0.04) * step;
      if (b.wq === 0 && b.tt > 1100) { b.sub = 0; b.cd = (b.ph === 3 ? 500 : 750) + 600 * f; }
    }
    // chuối đầu thẳng vào người chơi (nhảy lên khi boss rơi để né)
    if (b.kind === "dive" && (b.sub === 3 || (b.sub === 4 && b.tt < 350)) &&
        Math.abs(player.x + 27 - b.x) < 85 && player.y + player.h > ground - 60) hurt(20);
  }
}

let bossFaceO = null;
function makeFaceOutline() {      // viền xanh Doraemon quanh đầu
  const pad = 8, w = bossFace.naturalWidth, h = bossFace.naturalHeight;
  const c = document.createElement("canvas"); c.width = w + pad * 2; c.height = h + pad * 2;
  const t = document.createElement("canvas"); t.width = c.width; t.height = c.height;
  const tx = t.getContext("2d"), x = c.getContext("2d");
  tx.drawImage(bossFace, pad, pad);
  tx.globalCompositeOperation = "source-in"; tx.fillStyle = "#1e90ff"; tx.fillRect(0, 0, t.width, t.height);
  for (let a = 0; a < 20; a++) x.drawImage(t, Math.cos(a * Math.PI / 10) * 5, Math.sin(a * Math.PI / 10) * 5);
  x.drawImage(bossFace, pad, pad);
  bossFaceO = c;
}

function drawDora(cx, fy, s, tint, arms) {

  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#0b3d91"; ctx.lineWidth = 3;
  [-42, 42].forEach(x => { ctx.beginPath(); ctx.ellipse(x, -9, 30, 11, 0, 0, 7); ctx.fill(); ctx.stroke(); });
  ctx.fillStyle = B; ctx.beginPath(); ctx.roundRect(-66, -122, 132, 112, 40); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(0, -62, 46, 42, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -70, 30, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();   // túi thần kỳ
  [-82, 82].forEach(x => { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, -88, 17, 0, 7); ctx.fill(); ctx.stroke(); });
  if (arms) [-1, 1].forEach(k => {
    ctx.save(); ctx.lineCap = "round"; ctx.strokeStyle = "#0b3d91"; ctx.lineWidth = 24;
    ctx.beginPath(); ctx.moveTo(k * 56, -108); ctx.lineTo(k * 96, -142); ctx.stroke();
    ctx.strokeStyle = B; ctx.lineWidth = 17; ctx.stroke(); ctx.restore();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(k * 100, -146, 17, 0, 7); ctx.fill(); ctx.stroke();
  });
  if (bossFace.complete && bossFace.naturalWidth) {   // thay luôn cả đầu bằng mặt thật
    const fh = 156, fw = fh * bossFace.naturalWidth / bossFace.naturalHeight;
    if (!bossFaceO) makeFaceOutline();
    const k = fw / bossFace.naturalWidth, pd = 8 * k;
    ctx.drawImage(bossFaceO, -fw / 2 - pd, -176 - fh / 2 - pd, fw + 2 * pd, fh + 2 * pd);
  } else {
  ctx.fillStyle = B; ctx.beginPath(); ctx.arc(0, -172, 68, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(0, -160, 54, 50, 0, 0, 7); ctx.fill(); ctx.stroke();
  [-17, 17].forEach(x => { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(x, -196, 16, 21, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(x + (x < 0 ? 6 : -6), -192, 5, 0, 7); ctx.fill(); });
  ctx.fillStyle = "#e11d48"; ctx.beginPath(); ctx.arc(0, -172, 10, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -162); ctx.lineTo(0, -140); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -146, 34, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.lineWidth = 2;
  [-1, 1].forEach(k => [-8, 0, 8].forEach(dy => { ctx.beginPath(); ctx.moveTo(k * 22, -158 + dy); ctx.lineTo(k * 56, -164 + dy * 1.6); ctx.stroke(); }));
  }
  ctx.fillStyle = "#e11d48"; ctx.fillRect(-52, -116, 104, 12);
  ctx.fillStyle = "#facc15"; ctx.beginPath(); ctx.arc(0, -102, 10, 0, 7); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawBoss() {
  const b = boss, now = performance.now();
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 0.6, (Math.random() - 0.5) * shake * 0.6);
  const cx = b.x, bob = (b.sub === 0 || b.ph === 1) ? Math.sin(now * 0.004) * 6 : 0;

  if (b.st === "warn") {          // cảnh báo
    const a = 0.25 + 0.2 * Math.sin(now * 0.02);
    ctx.fillStyle = "rgba(220,38,38," + a + ")"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.lineWidth = 6; ctx.strokeStyle = "#450a0a";
    ctx.font = "bold 70px Arial"; ctx.fillStyle = "#fde047";
    const z = 1 + 0.05 * Math.sin(now * 0.02);
    ctx.save(); ctx.translate(W / 2, 200); ctx.scale(z, z);
    ctx.strokeText("9x ĐANG ĐẾN!", 0, 0); ctx.fillText("9x ĐANG ĐẾN!", 0, 0); ctx.restore();
    ctx.font = "bold 34px Arial"; ctx.fillStyle = "#fff";
    ctx.strokeText("⚠ CẢNH BÁO BOSS ⚠", W / 2, 262); ctx.fillText("⚠ CẢNH BÁO BOSS ⚠", W / 2, 262);
    ctx.textAlign = "left";
  } else {
    if (b.st === "absorb") {      // vòng xoáy hút quái
      const ox = b.x, oy = ground - 120;
      ctx.strokeStyle = "rgba(168,85,247,0.6)"; ctx.lineWidth = 3;
      for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(ox, oy, 40 + k * 45 + (now * 0.1 % 45), 0, 7); ctx.stroke(); }
      b.mon.forEach(m => { if (m.r > 8 && m.im.complete) {
        ctx.drawImage(m.im, ox + Math.cos(m.a) * m.r - 28, oy + Math.sin(m.a) * m.r * 0.6 - 28, 56, 56); } });
    }
    if (b.sub === 2) {            // dấu hiệu nơi boss sẽ rơi
      ctx.fillStyle = "rgba(239,68,68," + (0.35 + 0.35 * Math.sin(now * 0.03)) + ")";
      ctx.beginPath(); ctx.ellipse(b.lock, ground + 2, 90, 12, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 30px Arial"; ctx.textAlign = "center";
      ctx.fillText("❗", b.lock, ground - 30); ctx.textAlign = "left";
    }
    let tint = b.ph === 3 ? "#9f1239" : b.ph === 2 ? "#6d28d9" : null;
    if (b.flash > 0) tint = "#93c5fd";
    if (b.st === "morph") tint = Math.floor(now / 90) % 2 ? "#f43f5e" : "#6d28d9";
    drawDora(cx, b.y + bob, b.sc * (b.st === "morph" ? 1 + 0.05 * Math.sin(now * 0.04) : 1), tint, b.ph === 3);
    if (b.ph >= 2 && b.st !== "absorb") {
      ctx.strokeStyle = "rgba(244,63,94," + (0.4 + 0.3 * Math.sin(now * 0.01)) + ")"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(cx, b.y - 110, 110, 130, 0, 0, 7); ctx.stroke();
    }
    if (b.ph === 3 && b.eating) { ctx.strokeStyle = "rgba(250,204,21,0.85)"; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(b.x, b.y - 118, 118, 138, 0, 0, 7); ctx.stroke(); ctx.textAlign = "center"; ctx.font = "bold 26px Arial"; ctx.fillStyle = "#fde047";
      ctx.fillText("🍩 ĂN BÁNH RÁN — BẤT TỬ! (" + b.eatN + ")", b.x, ground - 260); ctx.textAlign = "left"; }
    if (b.st === "morph") { ctx.textAlign = "center"; ctx.font = "bold 40px Arial"; ctx.fillStyle = "#fde047";
      ctx.strokeStyle = "#450a0a"; ctx.lineWidth = 5; ctx.strokeText("BIẾN HÌNH!", W / 2, 120); ctx.fillText("BIẾN HÌNH!", W / 2, 120); ctx.textAlign = "left"; }
  }
  ctx.restore();

  // bánh rán
  bd.forEach(d => {
    if (d.air) {
      ctx.fillStyle = "rgba(186,230,253,0.55)"; ctx.beginPath(); ctx.ellipse(d.x + 14, d.y, 22, 8, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#e0f2fe"; ctx.strokeStyle = "#0ea5e9"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(d.x, d.y, 12, 0, 7); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(d.x, d.y, 6, d.a, d.a + 4); ctx.stroke(); return;
    }
    if (d.back) { ctx.fillStyle = "#fde047"; ctx.strokeStyle = "#f472b6"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(d.x, d.y, 15, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.beginPath(); ctx.arc(d.x - 4, d.y - 4, 5, 0, 7); ctx.fill(); return; }
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(Math.sin(d.a) * 0.25);
    ctx.lineWidth = 2; ctx.strokeStyle = "#92400e";
    ctx.fillStyle = "#d98a2b"; ctx.beginPath(); ctx.ellipse(0, 7, 20, 11, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#7c2d12"; ctx.beginPath(); ctx.ellipse(0, 0, 19, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#b4382e"; [-10, -2, 7, 13].forEach((x, k) => { ctx.beginPath(); ctx.arc(x, k % 2 ? 1 : -1, 2, 0, 7); ctx.fill(); });
    ctx.fillStyle = "#eaa63e"; ctx.beginPath(); ctx.ellipse(0, -6, 20, 11, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#f8d58a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(-3, -8, 11, 5, 0, 3.4, 5.6); ctx.stroke();
    ctx.restore();
  });
  // sóng xung kích
  waves.forEach(w => {
    const h = w.h || 44, t = performance.now() * 0.02;
    ctx.fillStyle = "rgba(168,85,247,0.35)"; ctx.beginPath(); ctx.ellipse(w.x, ground, 42, 9, 0, 0, 7); ctx.fill();
    for (let k = -1; k <= 1; k++) {
      const x = w.x + k * 17, hh = h * (k ? 0.75 : 1);
      const g = ctx.createLinearGradient(0, ground, 0, ground - hh);
      g.addColorStop(0, "rgba(255,255,255,0.95)"); g.addColorStop(0.5, "rgba(244,114,182,0.9)"); g.addColorStop(1, "rgba(168,85,247,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - 12, ground);
      ctx.quadraticCurveTo(x - 5, ground - hh * 0.6, x - 10 + Math.sin(t + k) * 6, ground - hh);
      ctx.quadraticCurveTo(x + 6, ground - hh * 0.5, x + 12, ground); ctx.fill();
    }
  });
  // đại bác không khí
  if (b.sub === 6 && b.cn) {
    const c = b.cn, y = c.seq[Math.min(c.si, c.seq.length - 1)], blink = 0.5 + 0.5 * Math.sin(performance.now() * 0.03);
    if (c.stage === "aim") {
      ctx.strokeStyle = "rgba(239,68,68," + (0.35 + 0.5 * blink) + ")"; ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
      ctx.beginPath(); ctx.moveTo(player.x + 70, y); ctx.lineTo(b.x - 170, y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = "#fde047"; ctx.font = "bold 18px Arial"; ctx.textAlign = "center";
      ctx.fillText(y < ground - 60 ? "ĐỨNG YÊN!" : "NHẢY!", 330, y - 12); ctx.textAlign = "left";
    } else {
      const g = ctx.createRadialGradient(b.x - 170, y, 3, b.x - 170, y, 36);
      g.addColorStop(0, "rgba(255,255,255,0.95)"); g.addColorStop(1, "rgba(56,189,248,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x - 170, y, 36, 0, 7); ctx.fill();
    }
    ctx.save(); ctx.translate(b.x - 90, y);
    ctx.fillStyle = "#475569"; ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(-78, -16, 82, 32, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#94a3b8"; ctx.fillRect(-78, -16, 14, 32);
    ctx.restore();
    if (c.si === 0 && c.stage === "aim") { ctx.textAlign = "center"; ctx.font = "bold 30px Arial"; ctx.fillStyle = "#fde047";
      ctx.strokeStyle = "#0c4a6e"; ctx.lineWidth = 5; ctx.strokeText("ĐẠI BÁC KHÔNG KHÍ!", W / 2, 110); ctx.fillText("ĐẠI BÁC KHÔNG KHÍ!", W / 2, 110); ctx.textAlign = "left"; }
  }

  // cánh cửa thần kỳ
  if (b.sub === 5) {
    const door = (x, a) => {
      ctx.save(); ctx.globalAlpha = a; ctx.translate(x, ground);
      ctx.fillStyle = "#f9a8d4"; ctx.strokeStyle = "#9d174d"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.roundRect(-30, -128, 60, 128, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fbcfe8"; ctx.fillRect(-20, -116, 40, 44); ctx.fillRect(-20, -64, 40, 50);
      ctx.fillStyle = "#facc15"; ctx.beginPath(); ctx.arc(18, -62, 5, 0, 7); ctx.fill();
      ctx.restore();
    };
    if (b.doorOpen) {
      const dx = b.x - 140;
      const gl = ctx.createRadialGradient(dx, ground - 64, 5, dx, ground - 64, 90);
      gl.addColorStop(0, "rgba(255,255,255," + (b.doorFlash > 0 ? 0.9 : 0.5) + ")"); gl.addColorStop(1, "rgba(244,114,182,0)");
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(dx, ground - 64, 90, 0, 7); ctx.fill();
      door(dx, 1);
      ctx.fillStyle = "#fff"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
      ctx.fillText("HẤP THỤ x" + (b.stored || 0), dx, ground - 138); ctx.textAlign = "left";
    }
    if (b.warned) {              // cửa sau lưng người chơi + vạch cảnh báo độ cao đạn
      const blink = 0.5 + 0.5 * Math.sin(performance.now() * 0.03);
      door(34, 0.6 + 0.4 * blink);
      ctx.strokeStyle = "rgba(239,68,68," + (0.4 + 0.4 * blink) + ")"; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
      for (let i = b.fi; i < b.hs.length; i++) { ctx.beginPath(); ctx.moveTo(70, b.hs[i]); ctx.lineTo(400, b.hs[i]); ctx.stroke(); }
      ctx.setLineDash([]);
      if (b.tt >= 3000 && b.fi < b.hs.length && b.ft <= 500) {      // viên đạn đang nạp
        const q = 1 - Math.max(0, b.ft) / 500;
        ctx.fillStyle = "rgba(253,224,71,0.9)"; ctx.beginPath(); ctx.arc(50, b.hs[b.fi], 5 + q * 10, 0, 7); ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(50, b.hs[b.fi], 9 + q * 8, 0, 7); ctx.stroke();
      }
      ctx.fillStyle = "#fde047"; ctx.font = "bold 22px Arial"; ctx.textAlign = "center";
      ctx.fillText("⚠ ĐẠN QUAY LẠI!", 130, ground - 150); ctx.textAlign = "left";
    }
  }
  // đạn người chơi
  pb.forEach(p => { ctx.fillStyle = dbl > 0 ? "#f97316" : "#fde047"; ctx.beginPath(); ctx.arc(p.x, p.y, dbl > 0 ? 8 : 6, 0, 7); ctx.fill(); });
  // vật phẩm
  drops.forEach(d => {
    ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.beginPath(); ctx.arc(d.x, d.y, 20, 0, 7); ctx.fill();
    ctx.font = "24px Arial"; ctx.textAlign = "center"; ctx.fillStyle = "#000";
    ctx.fillText(["❤️", "⚡", "🛡️"][d.type], d.x, d.y + 8); ctx.textAlign = "left";
  });
  // hiệu ứng trên người chơi
  if (shield > 0) { ctx.strokeStyle = "rgba(56,189,248,0.9)"; ctx.lineWidth = 4; ctx.beginPath();
    ctx.arc(player.x + 27, player.y + 39, 50, 0, 7); ctx.stroke(); }
  if (inv > 0 && shield <= 0 && Math.floor(inv / 80) % 2) { ctx.fillStyle = "rgba(239,68,68,0.45)"; ctx.fillRect(player.x, player.y, player.w, player.h); }

  // thanh máu
  if (b.st !== "warn") {
    const bx = 240, bw = 520;
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.beginPath(); ctx.roundRect(bx, 10, bw, 30, 10); ctx.fill();
    ctx.fillStyle = b.ph === 1 ? "#ef4444" : b.ph === 2 ? "#a855f7" : "#f43f5e";
    ctx.beginPath(); ctx.roundRect(bx, 10, Math.max(10, bw * Math.max(0, b.hp) / b.max), 30, 10); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(bx, 10, bw, 30, 10); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = "bold 17px Arial"; ctx.textAlign = "center";
    ctx.fillText("DORAEMON  •  GIAI ĐOẠN " + b.ph + "  •  " + Math.max(0, Math.ceil(b.hp)) + " HP", bx + bw / 2, 31); ctx.textAlign = "left";
  }
  ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.beginPath(); ctx.roundRect(12, 98, 300, 28, 10); ctx.fill();
  ctx.fillStyle = pHP > 40 ? "#22c55e" : "#ef4444"; ctx.beginPath(); ctx.roundRect(12, 98, Math.max(8, 3 * pHP), 28, 10); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(12, 98, 300, 28, 10); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = "bold 16px Arial";
  ctx.fillText("HP " + Math.ceil(pHP) + "/100" + (dbl > 0 ? "  ⚡x2" : "") + (shield > 0 ? "  🛡️" : ""), 20, 118);
}

function draw() {
  drawBackground();

  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 20);
    ctx.fillStyle = "#fff7ae";
    ctx.fillRect(p.x, p.y, 5, 5);
  });

  ctx.globalAlpha = 1;

  obstacles.forEach(drawObstacle);

  peas.forEach(p => {
    ctx.fillStyle = "#51cf66";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#2b8a3e";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath();
    ctx.arc(p.x - 3, p.y - 3, 3, 0, Math.PI * 2);
    ctx.fill();
  });

  if (princess) drawPrincess(princess);

  drawPlayer();
  if (boss) drawBoss();

  // Thanh tiến độ tới công chúa (chế độ phiêu lưu)
  if (mode === "adventure" && !menuOpen && phase === "play") {
    const bx = 250, bw = 500, by = 16;
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, 10, 5);
    ctx.fill();
    ctx.fillStyle = "#f472b6";
    ctx.beginPath();
    ctx.roundRect(bx, by, Math.max(10, bw * Math.min(1, score / WIN_SCORE)), 10, 5);
    ctx.fill();
    ctx.font = "22px Arial";
    ctx.textAlign = "center";
    ctx.fillText("👸", bx + bw + 24, by + 12);
    ctx.textAlign = "left";
  }

  // Tim bay
  hearts.forEach(h => {
    ctx.globalAlpha = Math.min(1, h.life / 30);
    ctx.font = h.s + "px Arial";
    ctx.textAlign = "center";
    ctx.fillText("💖", h.x, h.y);
  });
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";

  if (phase === "scare") drawScare();
  if (phase === "celebrate") drawCelebrate();

  if (!running && gameOver) {
    ctx.fillStyle = "rgba(8,20,36,0.65)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "white";
    ctx.font = "bold 46px Arial";
    ctx.fillText("GAME OVER!", W / 2, H / 2 - 25);

    ctx.font = "bold 23px Arial";
    ctx.fillText(
      "Điểm: " + Math.floor(score) +
      (mode === "adventure" ? " / " + WIN_SCORE : "") + " | Chạm để chơi lại",
      W / 2, H / 2 + 25
    );
    ctx.textAlign = "left";
  }
}

// Vòng lặp
function loop(timestamp) {
  let dt = lastTime ? Math.min(35, timestamp - lastTime) : 16.67;
  lastTime = timestamp;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

// Điều khiển
// Click / chạm bất kỳ chỗ nào trên màn hình để nhảy
document.getElementById("app").addEventListener("pointerdown", function(e) {
  if (e.target.closest("button")) return;
  e.preventDefault();
  jump();
});

document.getElementById("restart").addEventListener("click", function() {
  this.blur();
  if (menuOpen) return;
  reset();
});

// Luôn hiển thị ngang: màn hình dọc thì xoay khung game 90°
const stageEl = document.getElementById("stage");
function fitStage() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const portrait = vh > vw;
  const aw = portrait ? vh : vw;
  const ah = portrait ? vw : vh;
  const s = Math.min(aw / W, ah / H);
  if (portrait) {
    const tx = vw / 2 + (H * s) / 2;
    const ty = vh / 2 - (W * s) / 2;
    stageEl.style.transform = "translate(" + tx + "px," + ty + "px) rotate(90deg) scale(" + s + ")";
  } else {
    const tx = (vw - W * s) / 2;
    const ty = (vh - H * s) / 2;
    stageEl.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + s + ")";
  }
}
window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", function() { setTimeout(fitStage, 150); });
fitStage();

// Trên điện thoại: thử vào toàn màn hình + khóa ngang
function tryLandscape() {
  try {
    if (!window.matchMedia("(pointer: coarse)").matches) return;
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req && !document.fullscreenElement) {
      Promise.resolve(req.call(el)).then(function() {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function(){});
      }).catch(function(){});
    }
  } catch (e) {}
}

function refreshMenuTexts() {
  const be = Number(localStorage.getItem("monsterBest") || 0);
  const ba = Number(localStorage.getItem("monsterBestAdv") || 0);
  document.getElementById("bestEndless").textContent =
    "Chạy càng xa càng tốt" + (be ? " • Kỷ lục: " + be : "");
  document.getElementById("bestAdv").textContent =
    "Đạt " + WIN_SCORE + " điểm để giải cứu công chúa" + (ba ? " • Kỷ lục: " + ba : "");
}

function showMenu() {
  menuOpen = true;
  running = false;
  gameOver = false;
  phase = "play";
  princess = null;
  boss = null; pb = []; bd = []; drops = []; waves = [];
  refreshMenuTexts();
  menuEl.style.display = "flex";
}

function startGame(m, skip) {
  mode = m;
  skipBoss = !!skip;
  menuOpen = false;
  menuEl.style.display = "none";
  best = Number(localStorage.getItem(bestKey()) || 0);
  document.getElementById("best").textContent = best;
  document.getElementById("goal").textContent = m === "adventure" ? " / " + WIN_SCORE : "";
  document.getElementById("goalText").textContent = m === "adventure"
    ? "Đạt " + WIN_SCORE + " điểm để gặp và giải cứu công chúa!"
    : "Chế độ vô hạn: chạy càng xa càng tốt!";
  ensureAudio();
  tryLandscape();
  reset();
}

document.getElementById("m-endless").addEventListener("click", function() { startGame("endless"); });
document.getElementById("m-boss").addEventListener("click", function() { startGame("adventure", true); });
document.getElementById("m-adv").addEventListener("click", function() { startGame("adventure"); });
document.getElementById("menuBtn").addEventListener("click", function() { this.blur(); showMenu(); });

window.addEventListener("keydown", function(e) {
  if (["Space", "ArrowUp", "KeyW"].includes(e.code)) {
    e.preventDefault();
    if (!e.repeat) jump();
  }
});

reset();
showMenu();
requestAnimationFrame(loop);
</script>
